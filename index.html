<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --text:#1d1d1f; --muted:#666; --accent:#2f6f5e; --line:#e2e0da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --card:#212328; --text:#ececec; --muted:#a0a0a0; --accent:#7cc4ad; --line:#33363c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 32px; color:var(--muted); }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; color:inherit; text-decoration:none; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); }
  a.card strong { display:block; font-size:19px; color:var(--accent); margin-bottom:4px; }
  a.card span { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Study</h1>
  <p class="sub">Herzlich willkommen! Viel Erfolg und Freude beim Lernen. 🌟</p>
  <a class="card" href="web_build/">
    <strong>RPG – Lindenhain</strong>
    <span>Das Mini-JRPG im Browser spielen.</span>
  </a>
  <a class="card" href="HomeSweetHome/">
    <strong>HomeSweetHome – Hauskauf-Planer</strong>
    <span>Kosten und Finanzierung durchrechnen. Eingaben bleiben nur in deinem Browser gespeichert.</span>
  </a>
</main>
</body>
</html>
